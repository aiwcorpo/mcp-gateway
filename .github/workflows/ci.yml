# Thin wrapper: all logic is in ci/run.sh. The pull request job needs no registry and no secret. The push job reads the
# mcp-contracts artifacts from GitHub Packages with the GITHUB_TOKEN of the run (packages: read; the package must grant
# access to this repository); no personal access token is stored.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  merge-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - run: ci/self-test.sh
      - run: ci/run.sh hygiene
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - run: ci/self-test.sh
      - run: ci/run.sh verify
        env:
          MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
          MCP_MAVEN_REPOSITORY_USER: ${{ github.actor }}
          MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
