# Release of the image to ghcr.io with its SBOM, on a version tag. The publish and release jobs wait for an approval in the
# environment "release".
#
# Three jobs, so that no job with a write permission runs a build tool on the code or its dependencies:
#   build    contents: read. mvnw verify, the jar, the SBOM and docker build; the image leaves as a
#            docker save tarball in an artifact. The mcp-contracts artifacts come from Maven Central.
#   publish  packages: write. No checkout, no cache; docker load and docker push only. The token is in the environment
#            of the push step.
#   release  contents: write. No checkout; creates the draft release with the SBOM through gh (GH_REPO instead of a clone).
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-gateway
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Tag matches the pom version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(./mvnw -q -B -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
      - name: Verify, build the jar and the SBOM
        run: |
          ./mvnw -B verify
          ./mvnw -B -Prelease package -DskipTests
      - name: Build the image and save it
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$IMAGE:$version" .
          mkdir -p out
          docker save "$IMAGE:$version" -o out/image.tar
          cp target/*-sbom.json out/
      - name: Check the artifact file list
        run: |
          cd out
          unexpected="$(find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'image\.tar|[A-Za-z0-9._-]+-sbom\.json' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: out
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
          path: out
      - name: Check the artifact file list
        run: |
          cd out
          unexpected="$(find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'image\.tar|[A-Za-z0-9._-]+-sbom\.json' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f image.tar
      - name: Push the image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker load -i out/image.tar
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:$version"
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
          path: out
      - name: Check the artifact file list
        run: |
          cd out
          unexpected="$(find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'image\.tar|[A-Za-z0-9._-]+-sbom\.json' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f image.tar
      - name: Attach the SBOM to the release
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" out/*-sbom.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
