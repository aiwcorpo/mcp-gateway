# The gateway with its own PostgreSQL and Redis (primary and replica). Configuration: gateway.env and the files in certs/.
# The init service runs first on every start: it generates what is missing (passwords, internal JWT keys, cursor keys) and
# checks the configuration and the connections; the gateway starts only after it succeeds. See README.md.
#
# Closed network: MCP_REGISTRY and MCP_THIRD_PARTY_REGISTRY in a .env file next to this one point the images to your registry.

x-gateway: &gateway
  image: ${MCP_REGISTRY:-ghcr.io/aiwcorpo}/mcp-gateway:${MCP_GATEWAY_VERSION:-2.0.0}
  pull_policy: ${PULL_POLICY:-missing}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file: gateway.env
  environment: &gateway-env
    SPRING_CONFIG_IMPORT: optional:configtree:/secrets/gateway/env/
    MCP_DB_URL: jdbc:postgresql://postgres:5432/gateway
    MCP_REDIS_HOST: redis
    MCP_REDIS_WAIT_REPLICAS: "1"
    MCP_TLS_KEYSTORE: /certs/keystore.p12
    MCP_TLS_TRUSTSTORE: /certs/truststore.p12
  networks: [default, stores]

x-store: &store
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [stores]

services:
  init:
    <<: *gateway
    command: ["init", "/secrets"]
    restart: "no"
    tmpfs: ["/tmp"]
    volumes:
      - gateway-secrets:/secrets/gateway
      - postgres-secrets:/secrets/postgres
      - redis-secrets:/secrets/redis
      - ./certs:/certs:ro

  postgres:
    <<: *store
    image: ${MCP_THIRD_PARTY_REGISTRY:-docker.io/library}/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD_FILE: /secrets/postgres/password
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-secrets:/secrets/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      init: {condition: service_completed_successfully}

  redis:
    <<: *store
    image: ${MCP_THIRD_PARTY_REGISTRY:-docker.io/library}/redis:8.8.4-alpine@sha256:be8dfdf58574d626e0abe03073ce9178509e0e9564a316e34e71d2289b8370e1
    user: redis
    command: ["redis-server", "/secrets/redis/primary.conf"]
    volumes:
      - redis-data:/data
      - redis-secrets:/secrets/redis:ro
    # The default user is off, so an answer that asks for a login proves the server is up.
    healthcheck: &redis-health
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      init: {condition: service_completed_successfully}

  redis-replica:
    <<: *store
    image: ${MCP_THIRD_PARTY_REGISTRY:-docker.io/library}/redis:8.8.4-alpine@sha256:be8dfdf58574d626e0abe03073ce9178509e0e9564a316e34e71d2289b8370e1
    user: redis
    command: ["redis-server", "/secrets/redis/replica.conf"]
    volumes:
      - redis-replica-data:/data
      - redis-secrets:/secrets/redis:ro
    healthcheck: *redis-health
    depends_on:
      redis: {condition: service_healthy}

  gateway:
    <<: *gateway
    restart: unless-stopped
    tmpfs: ["/tmp:exec"]
    mem_limit: ${GATEWAY_MEM_LIMIT:-2g}
    volumes:
      - gateway-secrets:/secrets/gateway:ro
      - ./certs:/certs:ro
    # 8080: MCP clients, plain HTTP for your TLS reverse proxy. 8443: TLS with the gateway certificate, for the broker and the MCP
    # servers (JWKS of the internal JWT) and the admin API.
    ports:
      - ${GATEWAY_HTTP_BIND:-127.0.0.1}:8080:8080
      - 8443:8443
    healthcheck:
      # An open port is the signal (Tomcat opens connectors last).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      redis-replica: {condition: service_healthy}

networks:
  default: {}
  stores:
    internal: true

volumes:
  gateway-secrets:
  postgres-secrets:
  redis-secrets:
  postgres-data:
  redis-data:
  redis-replica-data:
