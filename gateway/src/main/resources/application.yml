# Environment variables follow mcp-platform-dev (docs/integracja.md, service mcp-gateway of profile "full").
server:
  port: ${MCP_GATEWAY_PORT:8080}
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
  shutdown: graceful

spring:
  application:
    name: mcp-gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${MCP_REDIS_HOST}
      port: ${MCP_REDIS_PORT:6379}
      username: ${MCP_REDIS_USER:gateway}
      password: ${MCP_REDIS_PASSWORD:}
      timeout: 2s
  mvc:
    problemdetails:
      enabled: false
  datasource:
    url: ${MCP_DB_URL}
    username: ${MCP_DB_USER:gateway}
    password: ${MCP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # The gateway's Redis ACL has no INFO, which the Redis health indicator needs.
    redis:
      enabled: false

gateway:
  component-id: mcp-gateway
  version: 0.1.0
  # Public origin (publicBaseUrl, CC-089): required, never derived from the Host of a request.
  public-url: ${MCP_PUBLIC_URL}
  allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  allow-plain-http: ${MCP_ALLOW_PLAIN_HTTP:false}
  oidc:
    issuer: ${MCP_OIDC_ISSUER}
    jwks-uri: ${MCP_OIDC_JWKS_URI}
    audience: ${MCP_OIDC_AUDIENCE:mcp-gateway}
    authorization-server: ${MCP_OIDC_AUTHORIZATION_SERVER:}
    token-uri: ${MCP_OIDC_TOKEN_URI:}
    client-id: ${MCP_OIDC_CLIENT_ID:}
    client-secret: ${MCP_OIDC_CLIENT_SECRET:}
  internal-jwt:
    issuer: ${MCP_INTERNAL_JWT_ISSUER:https://mcp-gateway.internal}
    lifetime: 30s
    keys-file: ${MCP_INTERNAL_JWT_KEYS_FILE:}
    active-kid: ${MCP_INTERNAL_JWT_ACTIVE_KID:}
    allow-test-keys: ${MCP_INTERNAL_JWT_ALLOW_TEST_KEYS:false}
  internal-endpoint:
    port: ${MCP_INTERNAL_PORT:8443}
  admin:
    audience: ${MCP_ADMIN_AUDIENCE:mcp-gateway-admin}
    authorized-party: ${MCP_ADMIN_AUTHORIZED_PARTY:mcp-portal-bff}
    allowed-client-cns: ${MCP_ADMIN_CLIENT_CNS:mcp-portal-bff}
    offboarding-client-cns: ${MCP_ADMIN_OFFBOARDING_CLIENT_CNS:mcp-offboarding}
  # Signed policy bundles (C7). No start without a main bundle (CC-068). The key files are PEM public keys (Ed25519);
  # identifiers starting with test- are accepted only with MCP_POLICY_ALLOW_TEST_KEYS=true (dev).
  policy:
    main-url: ${MCP_POLICY_MAIN_URL}
    overrides-url: ${MCP_POLICY_OVERRIDES_URL:}
    main-key-id: ${MCP_POLICY_MAIN_KEY_ID}
    main-key-file: ${MCP_POLICY_MAIN_KEY_FILE}
    overrides-key-id: ${MCP_POLICY_OVERRIDES_KEY_ID:}
    overrides-key-file: ${MCP_POLICY_OVERRIDES_KEY_FILE:}
    allow-test-keys: ${MCP_POLICY_ALLOW_TEST_KEYS:false}
    state-dir: ${MCP_POLICY_STATE_DIR:}
    minimum-main-revision: ${MCP_POLICY_MINIMUM_MAIN_REVISION:}
    minimum-overrides-revision: ${MCP_POLICY_MINIMUM_OVERRIDES_REVISION:}
    main-interval: ${MCP_POLICY_MAIN_INTERVAL:30s}
    overrides-interval: ${MCP_POLICY_OVERRIDES_INTERVAL:5s}
    startup-timeout: ${MCP_POLICY_STARTUP_TIMEOUT:2m}
  registry:
    mode: ${MCP_REGISTRY_MODE:required}
    bootstrap-from-server: ${MCP_REGISTRY_BOOTSTRAP:false}
    definition-check-ttl: ${MCP_REGISTRY_DEFINITION_CHECK_TTL:30s}
  activity:
    cursor-key: ${MCP_ACTIVITY_CURSOR_KEY:}
    retention: ${MCP_ACTIVITY_RETENTION:30d}
  # Request limits per window (CC-135): per user, per (user, AI client), per (user, tool); DESTRUCTIVE tools have a lower limit and
  # single tools can be set under tools: by the name the client sees, e.g. jira__delete_issue: 3.
  rate-limit:
    enabled: ${MCP_RATE_LIMIT_ENABLED:true}
    window: ${MCP_RATE_LIMIT_WINDOW:1m}
    per-user: ${MCP_RATE_LIMIT_PER_USER:600}
    per-client: ${MCP_RATE_LIMIT_PER_CLIENT:300}
    per-tool: ${MCP_RATE_LIMIT_PER_TOOL:120}
    destructive-per-tool: ${MCP_RATE_LIMIT_DESTRUCTIVE_PER_TOOL:10}
    audit-interval: ${MCP_RATE_LIMIT_AUDIT_INTERVAL:10s}
  mcp:
    # Milliseconds one server has for the read of its tools/list when a client lists tools (CC-180); a slower server is skipped.
    tools-list-timeout: ${MCP_TOOLS_LIST_TIMEOUT:3000}
    # HMAC key of the tools/list cursor (CC-181); the same on every instance, empty only in the dev stack (random per process).
    list-cursor-key: ${MCP_LIST_CURSOR_KEY:}
  metrics:
    allowed-client-cns: ${MCP_METRICS_CLIENT_CNS:}
  tls:
    keystore: ${MCP_TLS_KEYSTORE}
    truststore: ${MCP_TLS_TRUSTSTORE}
    store-password: ${MCP_TLS_STORE_PASSWORD}
  broker:
    url: ${MCP_BROKER_URL}
    tls-name: ${MCP_BROKER_TLS_NAME}
    timeout: 5s
    max-cache-ttl: 60s
  redis:
    host: ${MCP_REDIS_HOST}
    port: ${MCP_REDIS_PORT:6379}
    username: ${MCP_REDIS_USER:gateway}
    password: ${MCP_REDIS_PASSWORD:}
    key-prefix: ${MCP_REDIS_KEY_PREFIX:gw:}
    # Replicas that must acknowledge a change of the confirmation state before the gateway goes on (WAIT); 0 with a single Redis.
    wait-replicas: ${MCP_REDIS_WAIT_REPLICAS:0}
    wait-timeout: ${MCP_REDIS_WAIT_TIMEOUT:200ms}
  sessions:
    client-idle-timeout: 1h
    upstream-idle-timeout: 30m
  upstream:
    timeout: 30s
  # Static server configuration (stand-in for the registry, C5): serverId -> system, address, credential, tools
  # with risk and the catalog texts. Tools of the server that are not listed here are hidden and cannot be called.
  servers:
    mcp-jira:
      system: jira
      version: ${MCP_SERVER_JIRA_VERSION:1.0.0}
      enabled: ${MCP_SERVER_JIRA_ENABLED:true}
      internal-url: ${MCP_SERVER_JIRA_MCP_URL:${MCP_SERVER_JIRA_URL}/mcp}
      credential:
        required: true
        # The set of types the broker may return for the system (CC-166); the manifest of the server must accept every one of them
        # (CC-159). The Jira server accepts user-secret only, so OAuth is not allowed here until its manifest says so.
        accepted-types: [user-secret]
      tools:
        search_issues:
          risk: READ_ONLY
          title: Wyszukiwanie zgłoszeń (JQL)
          description: Searches Jira issues with a JQL query.
        get_issue:
          risk: READ_ONLY
          title: Pobranie zgłoszenia
          description: Returns one Jira issue by key.
          resource-refs:
            - {argument: issueKey, type: 'Jira::Issue'}
        add_comment:
          risk: UPDATE
          title: Dodanie komentarza
          description: Adds a comment to a Jira issue.
          resource-refs:
            - {argument: issueKey, type: 'Jira::Issue'}
        transition_issue:
          risk: UPDATE
          title: Zmiana statusu zgłoszenia
          description: Moves a Jira issue to another status.
          resource-refs:
            - {argument: issueKey, type: 'Jira::Issue'}
        delete_issue:
          risk: DESTRUCTIVE
          title: Usunięcie zgłoszenia
          description: Permanently deletes a Jira issue; confirmed with the code of the authenticator app.
          resource-refs:
            - {argument: issueKey, type: 'Jira::Issue'}
    mcp-confluence:
      system: confluence
      version: ${MCP_SERVER_CONFLUENCE_VERSION:1.0.0}
      enabled: ${MCP_SERVER_CONFLUENCE_ENABLED:true}
      internal-url: ${MCP_SERVER_CONFLUENCE_MCP_URL:https://mcp-confluence.internal:8443/mcp}
      credential:
        required: true
        accepted-types: [user-secret]
      tools:
        search_pages:
          risk: READ_ONLY
          title: Wyszukiwanie stron
          description: Searches the current pages of one Confluence space for the given words.
        get_page:
          risk: READ_ONLY
          title: Pobranie strony
          description: Returns one Confluence page with its metadata and the body as plain text.
        create_page:
          risk: UPDATE
          title: Utworzenie strony
          description: Creates a Confluence page in a space, under an existing parent page of the same space.
    mcp-gitlab:
      system: gitlab
      version: ${MCP_SERVER_GITLAB_VERSION:1.0.0}
      enabled: ${MCP_SERVER_GITLAB_ENABLED:true}
      internal-url: ${MCP_SERVER_GITLAB_MCP_URL:https://mcp-gitlab.internal:8443/mcp}
      credential:
        required: true
        accepted-types: [user-oauth, user-secret]
        # context.credentialType of the Cedar decisions (CC-136, CC-166): the default type of the system; the type the broker
        # returns must be in accepted-types.
        type: user-oauth
      tools:
        list_projects:
          risk: READ_ONLY
          title: Lista projektów grupy
          description: Lists the projects directly in one GitLab group, ordered by path, at most 100.
        get_file:
          risk: READ_ONLY
          title: Pobranie pliku z repozytorium
          description: Returns one UTF-8 text file from a GitLab repository at a branch, tag or commit.
        get_merge_request:
          risk: READ_ONLY
          title: Pobranie merge requesta
          description: Returns one merge request of a GitLab project by its number.
        comment_merge_request:
          risk: UPDATE
          title: Komentarz do merge requesta
          description: Adds a comment to a merge request of a GitLab project as the calling user.
    mcp-servicedesk:
      system: servicedesk
      version: ${MCP_SERVER_SERVICEDESK_VERSION:1.0.0}
      enabled: ${MCP_SERVER_SERVICEDESK_ENABLED:true}
      internal-url: ${MCP_SERVER_SERVICEDESK_MCP_URL:https://mcp-servicedesk.internal:8443/mcp}
      credential:
        required: true
        accepted-types: [service-account]
      tools:
        search_tickets:
          risk: READ_ONLY
          title: Wyszukiwanie zgłoszeń
          description: Searches the tickets of one service desk queue for a text.
        get_ticket:
          risk: READ_ONLY
          title: Pobranie zgłoszenia
          description: Returns one service desk ticket with its status, priority and the text.
        add_note:
          risk: UPDATE
          title: Dodanie notatki
          description: Adds a note to a service desk ticket.
    mcp-opensearch:
      system: opensearch
      version: ${MCP_SERVER_OPENSEARCH_VERSION:1.0.0}
      enabled: ${MCP_SERVER_OPENSEARCH_ENABLED:true}
      internal-url: ${MCP_SERVER_OPENSEARCH_MCP_URL:https://mcp-opensearch.internal:8443/mcp}
      credential:
        required: true
        accepted-types: [token-exchange]
        token-exchange: true
      tools:
        search_logs:
          risk: READ_ONLY
          title: Wyszukiwanie w logach
          description: Searches log documents in the indices matching one index pattern within a time range.
        get_document:
          risk: READ_ONLY
          title: Pobranie dokumentu
          description: Returns one document by index and id.
