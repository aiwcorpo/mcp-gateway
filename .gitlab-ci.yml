# The mcp-contracts artifacts come from Maven Central, so no job needs a credential. The tests start PostgreSQL and Redis with Testcontainers: use a runner with the Docker
# socket mounted that is dedicated to this project, or set DOCKER_HOST to a Docker-in-Docker service.
stages:
  - verify

default:
  image: maven:3.9.12-eclipse-temurin-25
  cache:
    key: maven
    paths: [.m2/repository]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

verify-merge-request:
  stage: verify
  # An isolated runner without the Docker socket of the host (a Docker-in-Docker service gives the tests their containers), and a
  # cache of its own that the job only reads: code of a merge request cannot poison the .m2 that the pipeline of main uses.
  tags: [isolated-no-docker-socket]
  cache:
    key: maven-merge-request
    policy: pull
    paths: [.m2/repository]
  script:
    - ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit:
        - "target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

verify:
  stage: verify
  script:
    - ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit:
        - "target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
